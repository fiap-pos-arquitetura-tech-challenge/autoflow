# CI AutoFlow
name: CI/CD

on:
  workflow_dispatch:
  
  push:
    branches:
      - feature/devops-aws

  pull_request:
    branches:
      - feature/devops-aws  

permissions: 
  contents: read

jobs:
  build-and-test:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: src/backend

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4    

      - name: Configurar .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restaurar dependências
        run: dotnet restore AutoFlow.slnx 

      - name: Compilar projeto
        run: dotnet build AutoFlow.slnx --no-restore --configuration Release

      - name: Executar testes
        run: dotnet test AutoFlow.slnx --no-build --configuration Release

      - name: Configure AWS credentials
        if: github.event_name == 'push'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Login to Amazon ECR
        if: github.event_name == 'push'
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build Docker image
        if: github.event_name == 'push'
        run: |
          VERSION="0.${{ github.run_number }}"

          docker build \
            -t autoflowapi:latest \
            -t autoflowapi:${VERSION} \
            -f src/AutoFlow.Api/Dockerfile \
            .

      - name: Push Docker image to ECR
        if: github.event_name == 'push'
        run: |
          VERSION="0.${{ github.run_number }}"
          ECR_REGISTRY="${{ steps.login-ecr.outputs.registry }}"

          docker tag autoflowapi:${VERSION} ${ECR_REGISTRY}/postech/autoflowapi:${VERSION}

          docker push ${ECR_REGISTRY}/postech/autoflowapi:${VERSION}

      - name: Configurar acesso ao EKS
        if: github.event_name == 'push'
        run: |
          aws eks update-kubeconfig \
            --region us-east-2 \
            --name autoflow-eks

      - name: Verificar acesso ao EKS
        if: github.event_name == 'push'
        run: |
          kubectl get nodes

      - name: Instalar Metrics Server
        if: github.event_name == 'push'
        working-directory: .
        run: |
          kubectl apply \
            --request-timeout=60s \
            -f https://github.com/kubernetes-sigs/metrics-server/releases/download/v0.9.0/components.yaml

          kubectl rollout status \
            deployment/metrics-server \
            -n kube-system \
            --timeout=180s

      - name: Configurar secrets no Kubernetes
        if: github.event_name == 'push'
        working-directory: .
        env:
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          CONNECTION_STRING="Server=autoflow-sqlserver.c7yk60eyi6ya.us-east-2.rds.amazonaws.com,1433;Database=AutoFlow;User Id=autoflowadmin;Password=${DB_PASSWORD};TrustServerCertificate=True"

          kubectl create secret generic autoflow-secrets \
            --from-literal="ConnectionStrings__DefaultConnection=${CONNECTION_STRING}" \
            --from-literal="Jwt__Secret=${JWT_SECRET}" \
            --dry-run=client \
            -o yaml | kubectl apply -f -

      - name: Aplicar ConfigMap
        if: github.event_name == 'push'
        working-directory: .
        run: |
          kubectl apply -f k8s/configmap.yaml

      - name: Executar migrations
        if: github.event_name == 'push'
        working-directory: .
        run: |
          VERSION="0.${{ github.run_number }}"

          kubectl delete job autoflow-db-migration --ignore-not-found=true

          sed "s|\${IMAGE_TAG}|${VERSION}|g" k8s/migration-job.yaml | kubectl apply -f -

          if ! kubectl wait \
            --for=condition=complete \
            --timeout=300s \
            job/autoflow-db-migration
          then
            echo "Migration falhou ou excedeu o tempo limite."
            kubectl logs job/autoflow-db-migration --all-containers=true || true
            kubectl describe job autoflow-db-migration || true
            exit 1
          fi

          echo "Migration concluída com sucesso."
          kubectl logs job/autoflow-db-migration

      - name: Deploy no Kubernetes
        if: github.event_name == 'push'
        working-directory: .
        run: |
          VERSION="0.${{ github.run_number }}"

          echo "Aplicando Deployment versão ${VERSION}..."
          sed "s|\${IMAGE_TAG}|${VERSION}|g" k8s/deployment.yaml | \
            kubectl apply --request-timeout=60s -f -

          echo "Aplicando Service..."
          kubectl apply --request-timeout=60s -f k8s/service.yaml

          echo "Aplicando HPA..."
          kubectl apply --request-timeout=60s -f k8s/hpa.yaml

          echo "Aguardando rollout..."
          kubectl rollout status deployment/autoflow-api --timeout=180s

          echo "Deploy concluído."