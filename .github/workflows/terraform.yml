name: Terraform

on:  
  push:
    branches:
      - feature/devops-aws

    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches:
      - feature/devops-aws

    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply

      confirm:
        description: "Para aplicar, digite APPLY"
        required: false
        default: ""
        type: string  

jobs:
  terraform:

    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: infra

    steps:

      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.confirm == 'APPLY'
        run: terraform apply -auto-approve