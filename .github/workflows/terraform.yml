name: Terraform

on:  
  push:
    branches:
      - main

    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

  pull_request:
    branches:
      - main

    paths:
      - 'infra/**'
      - '.github/workflows/terraform.yml'

  workflow_dispatch:
    inputs:
      action:
        description: "Ação do Terraform"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm:
        description: "Digite APPLY para aplicar ou DESTROY para destruir"
        required: false
        default: ""
        type: string  

jobs:
  terraform:

    runs-on: ubuntu-latest

    env:
      TF_VAR_db_password: ${{ secrets.DB_PASSWORD }}

    defaults:
      run:
        working-directory: infra

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-2

      - name: Instalar Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Format
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: github.event_name != 'workflow_dispatch' || inputs.action == 'plan'
        run: terraform plan

      - name: Terraform Apply
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && inputs.confirm == 'APPLY'
        run: terraform apply -auto-approve

      - name: Remover recursos Kubernetes
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'DESTROY'
        working-directory: .
        run: |
          if aws eks describe-cluster \
            --region us-east-2 \
            --name autoflow-eks > /dev/null 2>&1
          then
            echo "Cluster EKS encontrado."

            aws eks update-kubeconfig \
            --region us-east-2 \
            --name autoflow-eks          
          
            echo "Removendo Service e Load Balancer..."
            kubectl delete -f k8s/service.yaml --ignore-not-found=true

            echo "Removendo HPA..."
            kubectl delete -f k8s/hpa.yaml --ignore-not-found=true

            echo "Removendo Deployment..."
            kubectl delete -f k8s/deployment.yaml --ignore-not-found=true

            echo "Removendo Migration Job..."
            kubectl delete job autoflow-db-migration --ignore-not-found=true

            echo "Removendo ConfigMap..."
            kubectl delete -f k8s/configmap.yaml --ignore-not-found=true

            echo "Removendo Secret..."
            kubectl delete secret autoflow-secrets --ignore-not-found=true

          else
            echo "Cluster EKS não encontrado. Pulando limpeza dos recursos Kubernetes."
          fi

      - name: Aguardar limpeza do Load Balancer
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'DESTROY'
        working-directory: .
        run: |
          echo "Aguardando a AWS finalizar a remoção do Load Balancer..."
          sleep 90

      - name: Terraform Destroy
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && inputs.confirm == 'DESTROY'
        run: terraform destroy -auto-approve