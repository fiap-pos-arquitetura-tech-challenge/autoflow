services:
  autoflow.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ASPNETCORE_HTTPS_PORTS=8081
      - 'ConnectionStrings:DefaultConnection=Server=sqlserver;Database=AutoFlow;User Id=sa;Password=YourStrong!Passw0rd;TrustServerCertificate=True'
      - 'Jwt__Secret=DevOnlySecretKeyForLocalDockerUseOnly_ChangeMe_32Bytes!'
      - 'Integracoes__ApiKey=DevOnlyApiKeyForLocalDockerUseOnly_ChangeMe!'
      - 'Bootstrap__Colaborador__Nome=${AUTOFLOW_BOOTSTRAP_NOME:-Administrador AutoFlow}'
      - 'Bootstrap__Colaborador__Email=${AUTOFLOW_BOOTSTRAP_EMAIL:-colaborador@autoflow.local}'
      - 'Bootstrap__Colaborador__Senha=${AUTOFLOW_BOOTSTRAP_SENHA:-DevOnly@123456}'
      - 'Smtp__Host=mailcatcher'
      - 'Smtp__Port=1025'
      - 'Smtp__From=naoresponda@autoflow.local'
      - 'Smtp__UseSsl=false'
    ports:
      - "8080:8080"
      - "8081:8081"
    volumes:
      - ${APPDATA}/Microsoft/UserSecrets:/home/app/.microsoft/usersecrets:ro
      - ${APPDATA}/Microsoft/UserSecrets:/root/.microsoft/usersecrets:ro
      - ${APPDATA}/ASP.NET/Https:/home/app/.aspnet/https:ro
      - ${APPDATA}/ASP.NET/Https:/root/.aspnet/https:ro
    depends_on:
      mailcatcher:
        condition: service_started

  sqlserver:
    ports:
      - "1433:1433"

  mailcatcher:
    image: dockage/mailcatcher:0.9.0
    ports:
      - "1080:1080"
      - "1025:1025"
